name: Dated text maintenance

on:
  schedule:
    - cron: "23 9 1 * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-4-5
          use_github_token: true
          prompt: |
            Monthly dated-text maintenance for postil-cli.

            Find stale dates or time-sensitive wording in README, roadmap,
            architecture docs, install scripts, benchmark docs, workflow files,
            and user-facing help text. Update facts that can be verified from
            primary sources and open a pull request. If a claim cannot be
            verified safely, open an issue with the file path, stale text,
            source needed, and recommended owner action. Do not read or print
            secret values.
