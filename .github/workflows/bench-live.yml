name: Bench (managed OpenRouter admission)

# Manual only. This qualifies the managed hosted profile through OpenRouter.
# Direct BYOK endpoints use the local benchmark command documented in bench/.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: Exact generators::consensus::scorer+fallback profile
        required: true
      cost_cap_usd:
        description: Abort when projected qualification spend exceeds this amount
        required: true
        default: "15"

concurrency:
  group: bench-live-admission
  cancel-in-progress: false

jobs:
  bench-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      POSTIL_BENCH_MODE: live
      POSTIL_BENCH_PAIRS: ${{ inputs.pairs }}
      POSTIL_BENCH_REPEATS: "3"
      POSTIL_BENCH_COST_CAP_USD: ${{ inputs.cost_cap_usd }}
      POSTIL_API_BASE: https://openrouter.ai/api/v1
      POSTIL_API_FORMAT: openai-compatible
      POSTIL_QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Require main branch qualification
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Initialize unique evidence paths
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "POSTIL_REPORT_OUT=${RUNNER_TEMP}/postil-live-report-${suffix}.json"
            echo "POSTIL_MANIFEST_OUT=${RUNNER_TEMP}/postil-qualified-models-${suffix}.json"
            echo "POSTIL_ATTESTATION_BUNDLE_OUT=${RUNNER_TEMP}/postil-qualified-models-${suffix}.attestation.json"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --quiet --release

      - name: Install benchmark dependencies
        working-directory: bench
        run: bun install --frozen-lockfile

      - name: Prepare unique evidence paths
        run: rm -f "$POSTIL_REPORT_OUT" "$POSTIL_MANIFEST_OUT" "$POSTIL_ATTESTATION_BUNDLE_OUT"

      - name: Run exact admission profile
        working-directory: bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          bun run src/run.ts
          --json-out "$POSTIL_REPORT_OUT"
          --manifest-out "$POSTIL_MANIFEST_OUT"

      - name: Attest admitted candidate
        id: attest-candidate
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ env.POSTIL_MANIFEST_OUT }}

      - name: Export attestation bundle
        env:
          GENERATED_BUNDLE: ${{ steps.attest-candidate.outputs.bundle-path }}
        run: cp "$GENERATED_BUNDLE" "$POSTIL_ATTESTATION_BUNDLE_OUT"

      - name: Write admission summary
        if: always()
        working-directory: bench
        run: |
          report="$POSTIL_REPORT_OUT"
          {
            echo '## Live admission'
            echo ''
            if [ ! -f "$report" ]; then
              echo 'No report was produced.'
              exit 0
            fi
            echo '```'
            bun -e '
              const r = await Bun.file(process.env.POSTIL_REPORT_OUT).json();
              const pct = (value) => (value * 100).toFixed(1) + "%";
              const pad = (value, width) => String(value).length >= width
                ? String(value)
                : String(value) + " ".repeat(width - String(value).length);
              console.log([
                pad("profile", 52), pad("block", 8), pad("final", 8),
                pad("advisory", 9), pad("overblock", 10), pad("clean FP", 9),
                pad("$/review", 12), pad("p95 ms", 8), pad("pass", 5),
              ].join(" "));
              for (const a of r.modelAggregates) {
                console.log([
                  pad(a.id, 52), pad(pct(a.mustBlockRecall), 8),
                  pad(pct(a.mustBlockFinalBlockingRate), 8),
                  pad(pct(a.advisoryDetectionRate), 9),
                  pad(pct(a.advisoryOverblockRate), 10),
                  pad(pct(a.cleanFindingFalsePositiveRate), 9),
                  pad(a.pricingKnown ? "$" + a.meanCostUsdPerReview.toFixed(6) : "unknown", 12),
                  pad(a.p95DurationMs.toFixed(0), 8), pad(a.passed ? "yes" : "no", 5),
                ].join(" "));
                for (const failure of a.admissionFailures) console.log("  FAIL: " + failure);
              }
              console.log("");
              console.log("Repeats " + r.repeats + " | total $" + r.totalRunCostUsd.toFixed(6));
              console.log("CLI " + r.cliVersion + " | " + r.evaluatorRuntimeIdentity);
              console.log("Endpoint " + r.providerEndpointIdentity + " | " + r.apiFormat);
              console.log("Manifest " + (r.manifestCandidate ? "emitted" : "not admitted"));
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload admission report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-live-report
          path: ${{ env.POSTIL_REPORT_OUT }}
          if-no-files-found: warn

      - name: Upload admitted candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-models-candidate
          path: |
            ${{ env.POSTIL_MANIFEST_OUT }}
            ${{ env.POSTIL_ATTESTATION_BUNDLE_OUT }}
          if-no-files-found: error

      - name: Upload raw runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-live-raw-runs
          path: bench/.runs/live-models
          if-no-files-found: warn
