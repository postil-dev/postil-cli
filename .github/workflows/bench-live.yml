name: Bench (managed OpenRouter admission)

# Manual only. This qualifies the managed hosted profile through OpenRouter.
# Direct BYOK endpoints use the local benchmark command documented in bench/.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: Exact generators::consensus::scorer+fallback profile
        required: true
      upstream_provider:
        description: Exact ZDR provider identity serving every model in the profile
        required: true
      upstream_provider_route:
        description: Exact ZDR endpoint route serving every model in the profile
        required: true
      cost_cap_usd:
        description: Abort when projected qualification spend exceeds this amount
        required: true
        default: "70"

concurrency:
  group: bench-live-admission
  cancel-in-progress: false

jobs:
  bench-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      POSTIL_BENCH_MODE: live
      POSTIL_BENCH_PAIRS: ${{ inputs.pairs }}
      POSTIL_BENCH_UPSTREAM_PROVIDER: ${{ inputs.upstream_provider }}
      POSTIL_BENCH_UPSTREAM_PROVIDER_ROUTE: ${{ inputs.upstream_provider_route }}
      POSTIL_BENCH_REPEATS: "3"
      POSTIL_BENCH_COST_CAP_USD: ${{ inputs.cost_cap_usd }}
      POSTIL_API_BASE: https://openrouter.ai/api/v1
      POSTIL_API_FORMAT: openai-compatible
      POSTIL_QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Require main branch qualification
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Initialize unique evidence paths
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "POSTIL_REPORT_OUT=${RUNNER_TEMP}/postil-live-report-${suffix}.json"
            echo "POSTIL_MANIFEST_OUT=${RUNNER_TEMP}/postil-qualified-models-${suffix}.json"
            echo "POSTIL_PRIVATE_EVIDENCE_OUT=${RUNNER_TEMP}/postil-private-evidence-${suffix}.json"
            echo "POSTIL_PRIVATE_EVIDENCE_ENCRYPTED_OUT=${RUNNER_TEMP}/postil-private-evidence-${suffix}.json.gpg"
            echo "POSTIL_ATTESTATION_BUNDLE_OUT=${RUNNER_TEMP}/postil-qualified-models-${suffix}.attestation.json"
          } >> "$GITHUB_ENV"

      - name: Require managed admission capacity secrets
        env:
          COMPLETION_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
          COMPLETION_KEY_SHA256: ${{ secrets.OPENROUTER_QUALIFICATION_KEY_SHA256 }}
        run: >-
          test -n "$COMPLETION_API_KEY" &&
          test -n "$MANAGEMENT_API_KEY" &&
          test -n "$COMPLETION_KEY_SHA256"

      - name: Build release binary
        run: cargo build --quiet --release

      - name: Install benchmark dependencies
        working-directory: bench
        run: bun install --frozen-lockfile

      - name: Prepare unique evidence paths
        run: rm -f "$POSTIL_REPORT_OUT" "$POSTIL_MANIFEST_OUT" "$POSTIL_PRIVATE_EVIDENCE_OUT" "$POSTIL_PRIVATE_EVIDENCE_ENCRYPTED_OUT" "$POSTIL_ATTESTATION_BUNDLE_OUT"

      - name: Require private evidence encryption secret
        env:
          EVIDENCE_PASSPHRASE: ${{ secrets.POSTIL_PRIVATE_EVIDENCE_PASSPHRASE }}
        run: test -n "$EVIDENCE_PASSPHRASE"

      - name: Run exact admission profile
        working-directory: bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
          OPENROUTER_QUALIFICATION_KEY_SHA256: ${{ secrets.OPENROUTER_QUALIFICATION_KEY_SHA256 }}
        run: >-
          bun run src/run.ts
          --json-out "$POSTIL_REPORT_OUT"
          --manifest-out "$POSTIL_MANIFEST_OUT"
          --private-evidence-out "$POSTIL_PRIVATE_EVIDENCE_OUT"

      - name: Encrypt and verify private replay evidence
        id: encrypt-private-evidence
        env:
          EVIDENCE_PASSPHRASE: ${{ secrets.POSTIL_PRIVATE_EVIDENCE_PASSPHRASE }}
        run: |
          verify_path="${RUNNER_TEMP}/postil-private-evidence-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          printf '%s' "$EVIDENCE_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$POSTIL_PRIVATE_EVIDENCE_ENCRYPTED_OUT" \
            "$POSTIL_PRIVATE_EVIDENCE_OUT"
          printf '%s' "$EVIDENCE_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt "$POSTIL_PRIVATE_EVIDENCE_ENCRYPTED_OUT" > "$verify_path"
          cmp "$POSTIL_PRIVATE_EVIDENCE_OUT" "$verify_path"
          rm -f "$verify_path"

      - name: Attest admitted candidate
        id: attest-candidate
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ env.POSTIL_MANIFEST_OUT }}

      - name: Export attestation bundle
        env:
          GENERATED_BUNDLE: ${{ steps.attest-candidate.outputs.bundle-path }}
        run: cp "$GENERATED_BUNDLE" "$POSTIL_ATTESTATION_BUNDLE_OUT"

      - name: Write admission summary
        if: always()
        working-directory: bench
        run: |
          report="$POSTIL_REPORT_OUT"
          {
            echo '## Live admission'
            echo ''
            if [ ! -f "$report" ]; then
              echo 'No report was produced.'
              exit 0
            fi
            echo '```'
            bun -e '
              const { parseLiveModelsReport } = await import("./src/livemodels.ts");
              const { parseLiveModelsFailureReport } = await import("./src/run.ts");
              const raw = await Bun.file(process.env.POSTIL_REPORT_OUT).json();
              if (raw?.artifactType === "live-models-failure") {
                const failure = parseLiveModelsFailureReport(raw);
                const fact = (value) => value === null ? "unknown" : String(value);
                console.log("category " + failure.process.category);
                console.log("phase " + failure.process.phase);
                console.log("provider attempts " + fact(failure.process.providerAttemptCount));
                console.log("identity present " + fact(failure.process.identityPresent));
                console.log("identity matched " + fact(failure.process.identityMatched));
                console.log("usage present " + fact(failure.process.usagePresent));
                console.log("usage complete " + fact(failure.process.usageAccountingComplete));
                console.log("exit " + fact(failure.process.exitCode));
                console.log("signal " + fact(failure.process.signal));
                console.log("killed " + fact(failure.process.killed));
              } else {
                const r = parseLiveModelsReport(raw);
                const pct = (value) => (value * 100).toFixed(1) + "%";
                const pad = (value, width) => String(value).length >= width
                  ? String(value)
                  : String(value) + " ".repeat(width - String(value).length);
                console.log([
                  pad("profile", 52), pad("block", 8), pad("final", 8),
                  pad("advisory", 9), pad("overblock", 10), pad("clean FP", 9),
                  pad("$/review", 12), pad("p95 ms", 8), pad("pass", 5),
                ].join(" "));
                for (const a of r.modelAggregates) {
                  console.log([
                    pad(a.id, 52), pad(pct(a.mustBlockRecall), 8),
                    pad(pct(a.mustBlockFinalBlockingRate), 8),
                    pad(pct(a.advisoryDetectionRate), 9),
                    pad(pct(a.advisoryOverblockRate), 10),
                    pad(pct(a.cleanFindingFalsePositiveRate), 9),
                    pad(a.pricingKnown ? "$" + a.meanCostUsdPerReview.toFixed(6) : "unknown", 12),
                    pad(a.p95DurationMs.toFixed(0), 8), pad(a.passed ? "yes" : "no", 5),
                  ].join(" "));
                  for (const failure of a.admissionFailures) console.log("  FAIL: " + failure);
                }
                console.log("");
                console.log("Repeats " + r.repeats + " | total $" + r.totalRunCostUsd.toFixed(6));
                console.log("CLI " + r.cliVersion + " | " + r.evaluatorRuntimeIdentity);
                console.log("Endpoint " + r.providerEndpointIdentity + " | " + r.apiFormat);
                console.log("Manifest " + (r.manifestCandidate ? "emitted" : "not admitted"));
              }
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload admission report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-live-report
          path: ${{ env.POSTIL_REPORT_OUT }}
          if-no-files-found: warn

      - name: Upload admitted candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-models-candidate
          path: |
            ${{ env.POSTIL_MANIFEST_OUT }}
            ${{ env.POSTIL_ATTESTATION_BUNDLE_OUT }}
          if-no-files-found: error

      - name: Upload encrypted private replay evidence
        if: always() && steps.encrypt-private-evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-live-private-evidence
          path: ${{ env.POSTIL_PRIVATE_EVIDENCE_ENCRYPTED_OUT }}
          if-no-files-found: error

      - name: Remove private replay evidence
        if: always()
        run: rm -f "$POSTIL_PRIVATE_EVIDENCE_OUT" "$POSTIL_PRIVATE_EVIDENCE_ENCRYPTED_OUT"
