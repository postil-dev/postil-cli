name: Bench (live admission)

# Manual only. A run spends provider tokens and can emit an admission manifest
# only when the exact generator, scorer, runtime, and fixture profile passes.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: Exact generators::consensus::scorer+fallback profile
        required: true
      api_base:
        description: Model provider API base
        required: true
        default: https://openrouter.ai/api/v1
      api_format:
        description: Model provider interface
        required: true
        type: choice
        options:
          - openai-compatible
          - anthropic
        default: openai-compatible
      cost_cap_usd:
        description: Abort when projected qualification spend exceeds this amount
        required: true
        default: "15"

concurrency:
  group: bench-live-admission
  cancel-in-progress: false

jobs:
  bench-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTIL_BENCH_MODE: live
      POSTIL_BENCH_PAIRS: ${{ inputs.pairs }}
      POSTIL_BENCH_REPEATS: "3"
      POSTIL_BENCH_COST_CAP_USD: ${{ inputs.cost_cap_usd }}
      POSTIL_API_BASE: ${{ inputs.api_base }}
      POSTIL_API_FORMAT: ${{ inputs.api_format }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build release binary
        run: cargo build --quiet --release

      - name: Install benchmark dependencies
        working-directory: bench
        run: bun install --frozen-lockfile

      - name: Run exact admission profile
        working-directory: bench
        env:
          POSTIL_API_KEY: ${{ secrets.POSTIL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: >-
          bun run src/run.ts
          --json-out "$GITHUB_WORKSPACE/bench-live-report.json"
          --manifest-out "$GITHUB_WORKSPACE/qualified-models.json"

      - name: Write admission summary
        if: always()
        working-directory: bench
        run: |
          report="$GITHUB_WORKSPACE/bench-live-report.json"
          {
            echo '## Live admission'
            echo ''
            if [ ! -f "$report" ]; then
              echo 'No report was produced.'
              exit 0
            fi
            echo '```'
            bun -e '
              const r = await Bun.file(process.env.GITHUB_WORKSPACE + "/bench-live-report.json").json();
              const pct = (value) => (value * 100).toFixed(1) + "%";
              const pad = (value, width) => String(value).length >= width
                ? String(value)
                : String(value) + " ".repeat(width - String(value).length);
              console.log([
                pad("profile", 52), pad("block", 8), pad("final", 8),
                pad("advisory", 9), pad("overblock", 10), pad("clean FP", 9),
                pad("$/review", 12), pad("p95 ms", 8), pad("pass", 5),
              ].join(" "));
              for (const a of r.modelAggregates) {
                console.log([
                  pad(a.id, 52), pad(pct(a.mustBlockRecall), 8),
                  pad(pct(a.mustBlockFinalBlockingRate), 8),
                  pad(pct(a.advisoryDetectionRate), 9),
                  pad(pct(a.advisoryOverblockRate), 10),
                  pad(pct(a.cleanFindingFalsePositiveRate), 9),
                  pad(a.pricingKnown ? "$" + a.meanCostUsdPerReview.toFixed(6) : "unknown", 12),
                  pad(a.p95DurationMs.toFixed(0), 8), pad(a.passed ? "yes" : "no", 5),
                ].join(" "));
                for (const failure of a.admissionFailures) console.log("  FAIL: " + failure);
              }
              console.log("");
              console.log("Repeats " + r.repeats + " | total $" + r.totalRunCostUsd.toFixed(6));
              console.log("CLI " + r.cliVersion + " | " + r.evaluatorRuntimeIdentity);
              console.log("Endpoint " + r.providerEndpointIdentity + " | " + r.apiFormat);
              console.log("Manifest " + (r.manifestCandidate ? "emitted" : "not admitted"));
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-live-admission
          path: |
            bench-live-report.json
            qualified-models.json
          if-no-files-found: warn

      - name: Upload raw runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-live-raw-runs
          path: bench/.runs/live-models
          if-no-files-found: warn
