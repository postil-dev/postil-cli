name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag commit is not reachable from main."
            exit 1
          }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install admission verifier dependencies
        working-directory: bench
        run: bun install --frozen-lockfile
      - name: Verify embedded model admission
        working-directory: bench
        run: bun run verify-admission --allow-provisional
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "postil-cli") | .version')"
          test "$RELEASE_TAG" = "v$package_version" || {
            echo "Release tag $RELEASE_TAG does not match Cargo package version v$package_version" >&2
            exit 1
          }

  bench-live:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # A present-but-rejected key fails every benchmark case without naming the
      # credential. This bounded probe makes that failure immediate and explicit.
      - name: Require a working OpenRouter credential
        env:
          COMPLETION_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${COMPLETION_API_KEY}" ]]; then
            echo "::error::OPENROUTER_API_KEY is not set."
            exit 1
          fi
          status="$(curl --fail-with-body --silent --show-error \
            --output /tmp/openrouter-key.json --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${COMPLETION_API_KEY}" \
            https://openrouter.ai/api/v1/key)" || {
            echo "::error::OPENROUTER_API_KEY was rejected by OpenRouter (HTTP ${status:-none}). Rotate the repository secret."
            exit 1
          }
          # A key with a spent limit authenticates and then fails every call.
          if ! jq -e \
            '.data.limit_remaining == null or (.data.limit_remaining | type == "number")' \
            /tmp/openrouter-key.json >/dev/null; then
            echo "::error::OpenRouter returned an invalid credit limit." >&2
            exit 1
          fi
          if jq -e '.data.limit_remaining != null and .data.limit_remaining < 1' \
            /tmp/openrouter-key.json >/dev/null; then
            remaining="$(jq -r '.data.limit_remaining' /tmp/openrouter-key.json)"
            echo "::error::OPENROUTER_API_KEY has ${remaining} credit remaining, below the release benchmark reserve."
            exit 1
          fi
          remaining="$(jq -r '.data.limit_remaining // "unlimited"' /tmp/openrouter-key.json)"
          echo "OpenRouter credential accepted (remaining: ${remaining})."

      # Plain release profile: the same build the release job ships, so the
      # gate measures the binary users will actually get.
      - run: cargo build --quiet --release
      - name: Preserve benchmarked Linux binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarked-x86_64-unknown-linux-gnu
          path: target/release/postil
          if-no-files-found: error
          retention-days: 1
      - name: Install benchmark dependencies
        working-directory: bench
        run: bun install --frozen-lockfile

      - name: Run the embedded hosted scorer gate
        working-directory: bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POSTIL_BIN: ${{ github.workspace }}/target/release/postil
          POSTIL_SCORER_EVAL_REPEATS: "3"
          POSTIL_SCORER_EVAL_UPSTREAM_PROVIDER: Azure
          POSTIL_SCORER_EVAL_UPSTREAM_PROVIDER_ROUTE: azure/eu
          POSTIL_QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
        run: >-
          bun run scorer-eval --json-out
          "${{ runner.temp }}/scorer-eval-report.json"

      - name: Upload the scorer gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorer-eval-report
          path: |
            ${{ runner.temp }}/scorer-eval-report.json
            ${{ runner.temp }}/scorer-eval-report.json.partial
          if-no-files-found: warn
          retention-days: 30

      - name: Run diff-file live benchmark sample 1
        id: live-sample-1
        continue-on-error: true
        working-directory: bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POSTIL_BIN: ${{ github.workspace }}/target/release/postil
        run: >-
          bun run bench:live -- --screen-profile ../provisional-models.json
          --run-id "release-${{ github.ref_name }}-sample-1"
          --json-out "${{ runner.temp }}/bench-live-report-1.json"

      - name: Run diff-file live benchmark sample 2
        id: live-sample-2
        continue-on-error: true
        working-directory: bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POSTIL_BIN: ${{ github.workspace }}/target/release/postil
        run: >-
          bun run bench:live -- --screen-profile ../provisional-models.json
          --run-id "release-${{ github.ref_name }}-sample-2"
          --json-out "${{ runner.temp }}/bench-live-report-2.json"

      - name: Run diff-file live benchmark sample 3
        id: live-sample-3
        continue-on-error: true
        working-directory: bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POSTIL_BIN: ${{ github.workspace }}/target/release/postil
        run: >-
          bun run bench:live -- --screen-profile ../provisional-models.json
          --run-id "release-${{ github.ref_name }}-sample-3"
          --json-out "${{ runner.temp }}/bench-live-report-3.json"

      - name: Upload the diff-file live reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-live-reports
          path: |
            ${{ runner.temp }}/bench-live-report-1.json
            ${{ runner.temp }}/bench-live-report-2.json
            ${{ runner.temp }}/bench-live-report-3.json
          if-no-files-found: warn
          retention-days: 30

      - name: Compare against the recorded baseline
        if: always()
        working-directory: bench
        env:
          SAMPLE_1_OUTCOME: ${{ steps.live-sample-1.outcome }}
          SAMPLE_2_OUTCOME: ${{ steps.live-sample-2.outcome }}
          SAMPLE_3_OUTCOME: ${{ steps.live-sample-3.outcome }}
        run: |
          set -euo pipefail
          comparison=0
          bun run bench:compare -- \
            --binary "${{ github.workspace }}/target/release/postil" \
            --screen-profile ../provisional-models.json \
            --expected-run-id "release-${{ github.ref_name }}-sample-1" \
            --expected-run-id "release-${{ github.ref_name }}-sample-2" \
            --expected-run-id "release-${{ github.ref_name }}-sample-3" \
            --result "${{ runner.temp }}/bench-live-report-1.json" \
            --result "${{ runner.temp }}/bench-live-report-2.json" \
            --result "${{ runner.temp }}/bench-live-report-3.json" || comparison=$?
          if [[ "${SAMPLE_1_OUTCOME}" != "success" || \
                "${SAMPLE_2_OUTCOME}" != "success" || \
                "${SAMPLE_3_OUTCOME}" != "success" ]]; then
            echo "::error::At least one live benchmark sample failed before comparison."
            exit 1
          fi
          exit "${comparison}"

  build:
    needs: [validate-tag, bench-live]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            # musl needs the musl-gcc wrapper/linker from musl-tools (Alpine static build).
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            # musl support for ARM64 targets Alpine and other musl-libc systems on ARM.
            musl: true
          - target: x86_64-apple-darwin
            # macos-13 (the last plain Intel image) was retired in Dec 2025;
            # macos-15-intel is the designated replacement.
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Keyless signing: Sigstore issues a short-lived cert against the
      # workflow's OIDC identity. No private key to store or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --quiet
      # SHA-pinned: this action handles the OIDC token.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Download benchmarked Linux binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarked-x86_64-unknown-linux-gnu
          path: target/${{ matrix.target }}/release
      - name: Restore benchmarked binary mode
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: chmod 0755 target/${{ matrix.target }}/release/postil
      - name: Build release binary
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo build --quiet --release --target ${{ matrix.target }}
      - name: Package, checksum, and sign
        env:
          COSIGN_YES: "true"
        run: |
          cd target/${{ matrix.target }}/release
          art="postil-${{ matrix.target }}.tar.gz"
          tar czf "$art" postil
          # SHA-256 checksum (corruption / transit integrity).
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$art" > "$art.sha256"
          else
            shasum -a 256 "$art" > "$art.sha256"
          fi
          # Keyless Sigstore signature + certificate (provenance / authenticity).
          # Verify later with:
          #   cosign verify-blob "$art" --signature "$art.sig" --certificate "$art.pem" \
          #     --certificate-identity "https://github.com/postil-dev/postil-cli/.github/workflows/release.yml@refs/tags/$RELEASE" \
          #     --certificate-github-workflow-sha "$CLI_REF" \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign sign-blob --yes \
            --output-signature "$art.sig" \
            --output-certificate "$art.pem" \
            "$art"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/postil-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/postil-${{ matrix.target }}.tar.gz.sha256
            target/${{ matrix.target }}/release/postil-${{ matrix.target }}.tar.gz.sig
            target/${{ matrix.target }}/release/postil-${{ matrix.target }}.tar.gz.pem
          if-no-files-found: error
          retention-days: 1

  # Single fan-in publisher: six matrix legs racing to create the same
  # release is a known 422 flake in action-gh-release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # SHA-pinned: this action publishes the release assets.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
