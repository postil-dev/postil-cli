name: Scheduled audit

# Catches advisory drift between PRs: an advisory published against a dependency
# we already ship will not trip the per-PR CI audit until the next push, so run
# the same check on a weekly cron. Read-only and fails visibly.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pinned per org convention; comment tracks the tag.
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-audit
      - run: cargo audit
