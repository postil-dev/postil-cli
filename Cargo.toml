[package]
name = "postil-cli"
version = "0.8.21"
edition = "2024"
description = "Postil: a low-noise AI review gate. Silent on clean PRs, hard gate on real risk."
license = "Apache-2.0"
repository = "https://github.com/postil-dev/postil-cli"

[[bin]]
name = "postil"
path = "src/main.rs"

[lib]
name = "postil_cli"
path = "src/lib.rs"

[features]
default = []
# Builds the hermetic candidate-admission path used by the managed benchmark.
# Release artifacts do not enable this feature.
qualification-candidate = []

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3.32"
globset = "0.4.18"
httpdate = "1.0.3"
libc = "0.2.186"
memmap2 = "0.9.11"
owo-colors = "4.3.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
similar = "3.1.1"
tempfile = "3.27.0"
time = { version = "0.3.54", features = ["parsing", "formatting"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "time"] }
toml = "1.1.2"
yaml_serde = "0.10.4"

[build-dependencies]
serde_json = "1.0.150"

[dev-dependencies]
assert_cmd = "2.2.2"
csv = "1.4.0"
predicates = "3.1.4"
wiremock = "0.6.5"
